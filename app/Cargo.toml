[package]
name = "turbinehub"
description = "The first stop after installing SteamOS: setup, checks and settings from the couch"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "turbinehub"
path = "src/main.rs"

[dependencies]
turbinehub-engine = { path = "../engine" }
cxx = "1.0.176"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
sdl2 = { version = "0.37", default-features = false }

[build-dependencies]
cxx-qt-build = "0.10"
