[package]
name = "turbinehub-engine"
description = "Machine detection, setup, checks and the change ledger for Turbine Hub"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# No outside dependencies on purpose: fewer moving parts, nothing to audit, and it builds anywhere.
[dependencies]
# The helper's own types (settings, the change record), shared so the app writes exactly what the helper accepts.
turbinehub-helper = { path = "../helper" }
